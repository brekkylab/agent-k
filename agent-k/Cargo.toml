[package]
name = "agent-k"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "run"
path = "src/bin/run.rs"

[[bin]]
name = "test_case"
path = "src/bin/test_case.rs"

[features]

# The FinanceBench harness behind cfg(feature = "internal") needs the
# knowledge-base-examples crate, which lives outside this repository and is not
# vendored, submoduled, or published. Declaring `internal` as a real Cargo
# feature would make --all-features enable code whose dependency cannot be
# declared portably: a path dependency is resolved at manifest load regardless of
# which features are on, so it breaks `cargo check` for any clone without a
# sibling checkout. Tell rustc the cfg name is expected instead, which silences
# the unexpected_cfgs lint while leaving the harness opt-in through RUSTFLAGS for
# the few environments that have the crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("internal"))'] }

[dependencies]
ailoy = { workspace = true }
anyhow = "1.0.100"
chrono = { version = "0.4", features = ["serde"] }
docling-sys = { path = "../docling-sys" }
dirs = "6"
dotenvy = "0.15"
futures = "0.3"
html-to-markdown-rs = "3.9"
indexmap = "2"
log = "0.4"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tantivy = "0.26"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "fs", "signal", "sync"] }
tokio-stream = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v5"] }
kreuzberg = { version = "=4.10.2", features = ["bundled-pdfium"] }
