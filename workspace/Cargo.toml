[package]
name = "workspace"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
bytes = "1"
chrono = { version = "0.4.42", features = ["serde", "clock"] }
dotenvy = "0.15"
futures = "0.3"
futures-util = "0.3"
# macos-no-mount: run the host FUSE engine (Session::from_fd) on a macOS host
# with no macFUSE. Patched to the fork (see root [patch.crates-io]) whose wire
# layout is LINUX even on macOS, so the tunnel's replies are accepted by the
# Linux guest kernel. (Do NOT enable `macfuse-abi`.)
fuser = { version = "0.18", default-features = false, features = ["macos-no-mount"] }
libc = "0.2"
object_store = { version = "0.14", features = ["aws"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync", "net"] }
tracing = "0.1"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
bytes = "1"
futures-util = "0.3"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
uuid = { version = "1.18.1", features = ["v4"] }
