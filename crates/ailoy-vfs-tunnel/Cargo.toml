# Standalone workspace: this crate is excluded from the agent-k workspace and is
# only ever built for <arch>-unknown-linux-musl (the sandbox guest), by the
# backend's build.rs. The empty `[workspace]` makes it its own workspace root so
# it builds when invoked from within its own directory.
[workspace]

[package]
name = "ailoy-vfs-tunnel"
version = "0.1.0"
edition = "2021"
description = "Static in-guest raw-FUSE tunnel pump: mounts /dev/fuse and relays the raw FUSE wire protocol to the host, which runs the FUSE engine"
publish = false

[dependencies]
# Raw mount(2)/read/write syscalls for the pump — no libfuse, no fuser. The pump
# does zero protocol conversion; it just relays /dev/fuse bytes over a socket.
libc = "0.2"

[profile.release]
strip = true
opt-level = "z"
lto = true
