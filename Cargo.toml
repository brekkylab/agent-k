[workspace]
resolver = "3"
members = [
    "./agent-k",
    "./backend",
    "./docling-sys",
    "./workspace",
]
exclude = [
    "./backend-v1",
]

[workspace.dependencies]
agent-k = { path = "./agent-k" }
ailoy = { git = "https://github.com/brekkylab/ailoy.git", rev = "f1a311c21aa3e3cf719ee01efa07f60bdf47fa4c", features = ["sandbox"] }
# Direct cortex dep so agent-k defines the canonical `Workspace`/`WorkspaceSpec`
# it hands to the ailoy sandbox and serves from its own WebDAV. Same rev ailoy
# pins, so the `WorkspaceSpec` type unifies across the boundary. VFS providers
# only — no VM/FUSE binding (WebDAV is pure Mountable).
cortex = { git = "https://github.com/brekkylab/cortex.git", rev = "60b6477bbbd405b22d3ebc332019f6b9be12d30b", features = ["s3", "notion"] }
