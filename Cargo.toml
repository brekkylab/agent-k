[workspace]
resolver = "3"
members = [
    "./agent-k",
    "./backend",
    "./docling-sys",
    "./workspace",
]
exclude = [
    "./backend-v1",
]

[workspace.package]
# Matches the highest MSRV in the resolved graph (the Ailoy pin below). Declared
# on our own packages so an unsupported toolchain names agent-k rather than only
# a transitive git dependency. Keep in sync with rust-toolchain.toml.
rust-version = "1.95.0"

[workspace.dependencies]
agent-k = { path = "./agent-k" }
ailoy = { git = "https://github.com/brekkylab/ailoy.git", rev = "2b795e06269ee42a1de852fea0fdc05ba6a8a94c", features = ["sandbox"] }

# Patched fuser (branch feat/macfuse-abi): on macOS, upstream fuser emits macFUSE
# wire structs (extra crtime/flags in fuse_attr, minor pinned to 19) that a Linux
# guest kernel rejects with EINVAL. That layout is gated behind the `macfuse-abi`
# feature (on by default); backend opts out via `default-features = false` to
# emit the LINUX wire layout on macOS, so the raw-FUSE tunnel host engine
# (backend/src/sandbox_tunnel.rs) speaks the same protocol the in-guest Linux
# forwarder does. No-op on a Linux host.
[patch.crates-io]
fuser = { git = "https://github.com/brekkylab/fuser.git", rev = "4a08d0ba46f7e4911da1fdb73883f30a36637a28" }

# microsandbox 0.6.7 computes a sparse-sha256 integrity digest over the upper
# layer's full logical size (default 4 GiB) on snapshot create, save, and load.
# The backend archives a session's sandbox on shutdown and restores it on
# resume, so a dev-profile backend pays that hashing at unoptimized-sha2 speed
# (~130 MB/s, ~32 s per pass) on every archive/restore. Optimizing just the
# hash crates restores hardware-speed hashing (~2.6 GB/s). ailoy carries the
# same override, but Cargo applies profile overrides only from the workspace
# root of the build, so it has to be repeated here. Release builds already
# hash at full speed and are unaffected.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
