[workspace]
resolver = "3"
members = [
    "./agent-k",
    "./backend",
    "./docling-sys",
    "./workspace",
]
exclude = [
    "./backend-v1",
]

[workspace.dependencies]
agent-k = { path = "./agent-k" }
ailoy = { git = "https://github.com/brekkylab/ailoy.git", rev = "5c11bdbef46a3f2ca573948d74b627d3183ee9fd", features = ["sandbox"] }
# Direct cortex dep so agent-k defines the canonical `Workspace`/`WorkspaceSpec`
# it hands to the ailoy sandbox and serves from its own WebDAV. Same rev ailoy
# pins, so the `WorkspaceSpec` type unifies across the boundary. VFS providers
# only — no VM/FUSE binding (WebDAV is pure Mountable).
cortex = { git = "https://github.com/brekkylab/cortex.git", rev = "d32c0d6ef54873f0f9420a0d974810487339ecfb", features = ["s3", "notion"] }
