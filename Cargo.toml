[workspace]
resolver = "3"
members = [
    "./agent-k",
    "./backend",
    "./docling-sys",
]
exclude = [
    "./backend-v1",
]

[workspace.dependencies]
agent-k = { path = "./agent-k" }
ailoy = { git = "https://github.com/brekkylab/ailoy.git", rev = "d586abe3cb13885706802e4dfa0f4491d086466d", features = ["sandbox"] }
# Direct cortex dep so agent-k defines the canonical `Workspace`/`WorkspaceSpec`
# it hands to the ailoy sandbox and serves from its own WebDAV. Same rev ailoy
# pins, so the `WorkspaceSpec` type unifies across the boundary. VFS providers
# only — no VM/FUSE binding (WebDAV is pure Mountable).
cortex = { git = "https://github.com/brekkylab/cortex.git", rev = "595e4c3bd7561953b6a8474743e1bfcb12b3e3cc", features = ["s3", "notion"] }
